<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    body {
      font-family: Sarabun, sans-serif;
      background: #f4f7fb;
      min-height: 100vh;
    }

    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      padding: 28px;
    }

    .login-title {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .helper-text {
      font-size: 0.9rem;
      color: #666;
      text-align: center;
      margin-bottom: 18px;
    }

    .loading-box {
      display: none;
      text-align: center;
      margin-top: 12px;
      color: #0d6efd;
      font-size: 0.95rem;
    }

    .mobile-warning {
      display: none;
      max-width: 420px;
      margin: 40px auto;
      padding: 18px;
      border-radius: 12px;
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffe69c;
      text-align: center;
    }

    @media (max-width: 576px) {
      .login-card {
        display: none;
      }

      .mobile-warning {
        display: block;
      }
    }
  </style>
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-title">เข้าสู่ระบบ</div>
      <div class="helper-text">กรุณาเลือกชื่อผู้ใช้และกรอกรหัสผ่าน</div>

      <div class="mb-3">
        <label for="dynamicDropdown" class="form-label">Username</label>
        <select class="form-select" id="dynamicDropdown">
          <option value="">กำลังโหลดข้อมูล...</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="floatingPassword" class="form-label">Password</label>
        <input type="password" class="form-control text-center" id="floatingPassword" placeholder="Password">
      </div>

      <button type="button" class="btn btn-primary w-100" onclick="checkCredentials()">Sign in</button>
      <a href="index.html" class="btn btn-outline-secondary w-100 mt-2">ปิด</a>

      <div id="loadingBox" class="loading-box">กำลังตรวจสอบข้อมูล...</div>
    </div>
  </div>

  <div class="mobile-warning">
    This device not support, Open this page on PC.
  </div>

  <script>
    const BASE_URL = "YOUR_WEB_APP_URL";

    function showLoading(message = "กำลังโหลดข้อมูล...") {
      const box = document.getElementById("loadingBox");
      box.innerText = message;
      box.style.display = "block";
    }

    function hideLoading() {
      document.getElementById("loadingBox").style.display = "none";
    }

    function loadDropdownData() {
      showLoading("กำลังโหลดรายชื่อผู้ใช้...");

      fetch(BASE_URL + "?type=userdetail")
        .then(response => response.json())
        .then(data => {
          const dropdown = document.getElementById("dynamicDropdown");
          dropdown.innerHTML = "";

          if (!Array.isArray(data) || data.length === 0) {
            dropdown.innerHTML = `<option value="">ไม่พบข้อมูล</option>`;
            hideLoading();
            return;
          }

          data.forEach(row => {
            const option = document.createElement("option");
            option.value = row.username || "";
            option.text = row.username || "";
            dropdown.appendChild(option);
          });

          hideLoading();
        })
        .catch(error => {
          console.error("Error fetching userdetail:", error);
          document.getElementById("dynamicDropdown").innerHTML = `<option value="">โหลดข้อมูลไม่สำเร็จ</option>`;
          hideLoading();
          alert("เกิดข้อผิดพลาดในการโหลดข้อมูลผู้ใช้");
        });
    }

    function checkCredentials() {
      const dropdown = document.getElementById("dynamicDropdown");
      const selectedValue = dropdown.value.trim();   // ค่านี้ = UserDetail[1] = Main[67]
      const passwordInput = document.getElementById("floatingPassword").value.trim();

      if (!selectedValue) {
        alert("กรุณาเลือก Username");
        return;
      }

      if (!passwordInput) {
        alert("กรุณากรอก Password");
        return;
      }

      showLoading("กำลังตรวจสอบข้อมูล...");

      fetch(BASE_URL + "?type=userdetail")
        .then(response => response.json())
        .then(users => {
          if (!Array.isArray(users)) {
            hideLoading();
            alert("รูปแบบข้อมูลผู้ใช้ไม่ถูกต้อง");
            return;
          }

          const user = users.find(row =>
            String(row.username || "").trim() === selectedValue &&
            String(row.password || "").trim() === passwordInput
          );

          if (!user) {
            hideLoading();
            alert("Wrong Username or Password! Please try again.");
            return;
          }

          // ค่านี้จะเอาไปเทียบกับ Main[67]
          localStorage.setItem("selectedCustomer", selectedValue);
          localStorage.setItem("selectedDropdownValue", selectedValue);

          hideLoading();
          window.location.href = "pe.html";
        })
        .catch(error => {
          console.error("Error:", error);
          hideLoading();
          alert("Error connecting to the server. Please try again later.");
        });
    }

    window.onload = loadDropdownData;
  </script>

</body>
</html>
